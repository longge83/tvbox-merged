name: update-tvbox-config

on:
  schedule:
    # 每天 UTC 20:00（北京时间次日 04:00）自动构建
    - cron: '0 20 * * *'
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

concurrency:
  group: update-tvbox-config
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 聚合 + 存活复检
        run: python scripts/build.py

      # 首页推荐 ≠ 搜索：分别探测 CMS 首页影片列表、爬虫 jar 与 ext 首页配置，
      # 生成只含「能出首页」节点的 tvbox-home.json。云端直连，避免本机网络误判。
      - name: 首页推荐能力探测
        continue-on-error: true
        run: |
          python scripts/home_probe.py \
            --input tvbox.json --workers 50 \
            --report home_report.json --output tvbox-home.json

      # 全量/精简版保持完整节点，只把已探活的首页节点排到最前面，
      # 让客户端默认落在能出推荐的源上，同时不牺牲搜索与其它源。
      - name: 生成首页优先版
        continue-on-error: true
        run: python scripts/rank_home.py

      - name: 有变更则提交
        id: commit
        run: |
          git add tvbox.json tvbox-lite.json 2>/dev/null || true
          git add tvbox-home.json home-sites.txt 2>/dev/null || true
          git add tvbox-full-homefirst.json tvbox-lite-homefirst.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "配置无变化，跳过提交"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 更新聚合配置 $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      # jsDelivr 对 @分支 的响应带 s-maxage=43200（CDN 缓存 12 小时），
      # 不主动清缓存的话，每天生成的新配置要等最多 12 小时才能被镜像取到，
      # 且各边缘节点不同步，会出现"有的设备新、有的设备旧"。
      - name: 刷新 jsDelivr CDN 缓存
        if: always()
        run: |
          echo "本次是否有提交: ${{ steps.commit.outputs.changed }}"
          # GitHub raw 全球传播有延迟，太早清缓存会让 CDN 回源拉到旧 blob
          # 并重新缓存（曾出现镜像滞留上一轮配置）。等 30s + 两轮 purge。
          sleep 30
          FILES="tvbox.json tvbox-lite.json tvbox-home.json tvbox-full-homefirst.json tvbox-lite-homefirst.json"
          for pass in 1 2; do
            echo "=== purge 第 $pass 轮 ==="
            for f in $FILES; do
              echo "--- purge $f ---"
              curl -fsS --max-time 30 \
                "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" \
                || echo "purge $f failed (non-fatal)"
            done
            [ "$pass" = "1" ] && sleep 8
          done
